<style>
mark.mlx-hl{background:#f6e2b0;color:inherit;padding:0 .15em;border-radius:3px;box-shadow:inset 0 -2px 0 #d4a24c}
</style>
<script>
(function(){
  if(!document.body.classList.contains('search')) return;
  var q=new URLSearchParams(location.search).get('s'); if(!q) return;
  var words=q.trim().split(/\s+/).filter(function(w){ return w.length>1; });
  if(!words.length) return;
  var esc=words.map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,function(c){ return '\\'+c; }); });
  var re=new RegExp('\\b('+esc.join('|')+')\\b','gi');
  function mark(el){
    var tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null), nodes=[], n;
    while((n=tw.nextNode())) nodes.push(n);
    nodes.forEach(function(t){
      var s=t.nodeValue; re.lastIndex=0; if(!re.test(s)) return; re.lastIndex=0;
      var frag=document.createDocumentFragment(), last=0, m;
      while((m=re.exec(s))){ frag.appendChild(document.createTextNode(s.slice(last,m.index))); var mk=document.createElement('mark'); mk.className='mlx-hl'; mk.textContent=m[0]; frag.appendChild(mk); last=m.index+m[0].length; }
      frag.appendChild(document.createTextNode(s.slice(last))); t.parentNode.replaceChild(frag,t);
    });
  }
  document.querySelectorAll('.wp-block-query .wp-block-post-title, .wp-block-query .wp-block-post-excerpt').forEach(mark);
  // If a result's excerpt does not contain the term, fetch the page and show the sentence where it appears
  function snippet(text){
    var tokens=text.split(/\s+/), hit=-1;
    for(var i=0;i<tokens.length;i++){ re.lastIndex=0; if(re.test(tokens[i])){ hit=i; break; } }
    if(hit<0) return null;
    var start=Math.max(0,hit-12), end=Math.min(tokens.length,start+32);
    return (start>0?'… ':'')+tokens.slice(start,end).join(' ')+(end<tokens.length?' …':'');
  }
  var items=[].slice.call(document.querySelectorAll('.wp-block-query .wp-block-post')).slice(0,10);
  items.forEach(function(li){
    var ex=li.querySelector('.wp-block-post-excerpt__excerpt'), a=li.querySelector('.wp-block-post-title a');
    if(!ex){ return; } if(!a){ return; } if(ex.querySelector('mark.mlx-hl')){ return; }
    fetch(a.href,{credentials:'same-origin'}).then(function(r){ return r.ok?r.text():''; }).then(function(html){
      if(!html){ return; }
      var doc=new DOMParser().parseFromString(html,'text/html');
      var root=doc.querySelector('.wp-block-post-content')||doc.querySelector('main')||doc.body;
      var blocks=root.querySelectorAll('p, li, h2, h3, h4, td');
      for(var i=0;i<blocks.length;i++){
        var t=(blocks[i].textContent||'').replace(/\s+/g,' ').trim(); re.lastIndex=0;
        if(t){ if(re.test(t)){ var sn=snippet(t); if(sn){ ex.textContent=sn; mark(ex); return; } } }
      }
    }).catch(function(){});
  });
})();
</script>
