<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniEx — адмін</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    #content { display: flex; flex-direction: column; gap: 12px; }
    .panel { padding-bottom: 8px; }
    .kv { display: flex; flex-wrap: wrap; gap: 28px; padding: 12px 16px; }
    .kv small { display: block; color: var(--muted); margin-bottom: 3px; }
    .login { display: flex; gap: 8px; padding: 16px; }
    .login input { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; flex: 1; max-width: 360px; }
  </style>
</head>
<body>
<header class="top"><div class="logo">Mini<span>Ex</span> <span class="muted" style="font-size:14px;font-weight:400">адмін</span></div>
  <div class="spacer"></div><a class="link-btn" href="/">← До біржі</a></header>
<div class="wrap">
  <section class="panel hidden" id="login">
    <div class="panel-title">Вхід адміністратора</div>
    <form class="login" id="login-form"><input type="password" name="token" placeholder="ADMIN_TOKEN" autocomplete="off" required><button class="btn primary">Увійти</button></form>
    <div class="error" id="login-err" style="padding:0 16px"></div>
  </section>
  <div id="content"></div>
</div>
<script src="/admin.js"></script>
</body>
</html>
